services:
  db:
    image: pgvector/pgvector:pg16
    container_name: learnlens-pgvector
    environment:
      POSTGRES_USER: learnlens
      POSTGRES_PASSWORD: learnlens
      POSTGRES_DB: learnlens
    ports:
      - "5432:5432"
    volumes:
      - learnlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnlens -d learnlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learnlens_pgdata:
